# Configuración de Fly.io para MailK (app desplegada en São Paulo).
# Secretos requeridos (no van aquí): MAILK_API_TOKEN, MAILK_SMTP_USER, MAILK_SMTP_PASS
#   fly secrets set MAILK_API_TOKEN=... MAILK_SMTP_USER=... MAILK_SMTP_PASS=...
app = "mailk"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  MAILK_AUTH = "on"
  MAILK_AUTO_CREATE = "on"
  MAILK_DEFAULT_GROUP = "default"
  MAILK_DB = "/data/mailk.db"
  MAILK_HTTP_PORT = "8025"

[[mounts]]
  source = "mailk_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# API + UI web por HTTPS (mailk.fly.dev)
[http_service]
  internal_port = 8025
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

# SMTP
[[services]]
  protocol = "tcp"
  internal_port = 1025
  auto_stop_machines = "off"
  [[services.ports]]
    port = 1025

# IMAP
[[services]]
  protocol = "tcp"
  internal_port = 1143
  auto_stop_machines = "off"
  [[services.ports]]
    port = 1143

# POP3
[[services]]
  protocol = "tcp"
  internal_port = 1110
  auto_stop_machines = "off"
  [[services.ports]]
    port = 1110
